name: lastwish
description: "LastWish mobile app"
publish_to: 'none'

version: 1.0.26+40

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_ringtone_player: ^4.0.0
  purchases_flutter: ^10.9.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  flutter_local_notifications: ^18.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bg.webp

flutter_native_splash:
  color: "#0f172a"
  image: assets/logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0f172a"
  web:
    generate: false

  sleek_circular_slider: ^2.0.1
